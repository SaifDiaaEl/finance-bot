<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المساعد المالي الذكي - لوحة التحكم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gradient-to-br from-emerald-900 via-gray-900 to-black min-h-screen text-white">
  <!-- Login Screen -->
  <div id="loginScreen" class="flex items-center justify-center min-h-screen p-6">
    <div class="bg-gray-800/80 backdrop-blur-md rounded-2xl p-8 shadow-2xl border border-emerald-500/35 max-w-md w-full text-center">
      <div class="inline-flex p-3 bg-emerald-500/20 rounded-full text-emerald-400 mb-4">
        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
      </div>
      <h1 class="text-2xl font-bold mb-2">المساعد المالي الذكي</h1>
      <p class="text-gray-400 text-sm mb-6">ادخل رقم Telegram ID الخاص بك لعرض مصاريفك</p>
      <div class="space-y-3">
        <input type="text" id="loginPhone" dir="ltr" placeholder="Telegram ID مثل: 123456789" class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white text-center focus:outline-none focus:border-emerald-500 font-mono">
        <input type="password" id="loginPassword" dir="ltr" placeholder="الباسورد (اختياري)" class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white text-center focus:outline-none focus:border-emerald-500 font-mono">
        <button onclick="doLogin()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 transition rounded-xl font-bold shadow-lg shadow-emerald-600/30">دخول</button>
      </div>
      <p id="loginError" class="text-red-400 text-sm mt-3 hidden">رقم غير صحيح أو巴斯ورد غلط</p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden p-6">
    <div class="max-w-4xl mx-auto">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-2xl font-bold">لوحة التحكم</h1>
          <p id="welcomeText" class="text-gray-400 text-sm"></p>
        </div>
        <div class="flex gap-2">
          <button onclick="loadData()" class="px-4 py-2 bg-emerald-600/80 hover:bg-emerald-600 rounded-xl text-sm font-medium transition">تحديث</button>
          <button onclick="doLogout()" class="px-4 py-2 bg-red-600/80 hover:bg-red-600 rounded-xl text-sm font-medium transition">خروج</button>
        </div>
      </div>

      <!-- Summary Cards -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-gray-800/80 rounded-xl p-4 border border-emerald-500/20">
          <div class="text-gray-400 text-xs mb-1">الميزانية</div>
          <div id="budget" class="text-xl font-bold text-emerald-400">-</div>
        </div>
        <div class="bg-gray-800/80 rounded-xl p-4 border border-red-500/20">
          <div class="text-gray-400 text-xs mb-1">المصروفات</div>
          <div id="expenses" class="text-xl font-bold text-red-400">-</div>
        </div>
        <div class="bg-gray-800/80 rounded-xl p-4 border border-blue-500/20">
          <div class="text-gray-400 text-xs mb-1">الدخل</div>
          <div id="income" class="text-xl font-bold text-blue-400">-</div>
        </div>
        <div class="bg-gray-800/80 rounded-xl p-4 border border-yellow-500/20">
          <div class="text-gray-400 text-xs mb-1">المتبقي</div>
          <div id="remaining" class="text-xl font-bold text-yellow-400">-</div>
        </div>
      </div>

      <!-- Charts Row -->
      <div class="grid md:grid-cols-2 gap-6 mb-8">
        <!-- Pie Chart -->
        <div class="bg-gray-800/80 rounded-2xl p-6 border border-gray-700">
          <h2 class="text-lg font-bold mb-4">توزيع المصروفات</h2>
          <div class="relative" style="height:260px">
            <canvas id="pieChart"></canvas>
          </div>
          <div id="pieLegend" class="mt-3 space-y-1"></div>
        </div>

        <!-- Monthly Comparison -->
        <div class="bg-gray-800/80 rounded-2xl p-6 border border-gray-700">
          <h2 class="text-lg font-bold mb-4">مقارنة الشهور</h2>
          <div class="relative" style="height:260px">
            <canvas id="barChart"></canvas>
          </div>
        </div>
      </div>

      <!-- Egyptian Average -->
      <div class="bg-gray-800/80 rounded-2xl p-6 mb-8 border border-gray-700">
        <h2 class="text-lg font-bold mb-4">مقارنة بمتوسط المصروفات في مصر</h2>
        <div id="avgComparison" class="space-y-3">
          <div class="text-gray-400 text-sm">جاري التحميل...</div>
        </div>
      </div>

      <!-- Categories List -->
      <div class="bg-gray-800/80 rounded-2xl p-6 mb-8 border border-gray-700">
        <h2 class="text-lg font-bold mb-4">التصنيفات بالتفصيل</h2>
        <div id="categories" class="space-y-2">
          <div class="text-gray-400 text-sm">جاري التحميل...</div>
        </div>
      </div>

      <!-- Transactions -->
      <div class="bg-gray-800/80 rounded-2xl p-6 border border-gray-700">
        <h2 class="text-lg font-bold mb-4">آخر العمليات</h2>
        <div id="transactions" class="space-y-2">
          <div class="text-gray-400 text-sm">جاري التحميل...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let pieChartInstance = null;
    let barChartInstance = null;

    const EGYPTIAN_AVERAGES = {
      'أكل ومشروبات': 3500,
      'مواصلات': 1200,
      'فواتير واشتراكات': 800,
      'تسوق': 1000,
      'ترفيه': 600,
      'صحة': 400,
      'تعليم': 500,
      'سكن وأيجار': 4000,
      'ملابس': 500,
      'هدايا': 300,
      'أولاد': 1500,
      'حيوانات أليفة': 200,
      'أخرى': 500
    };

    const CATEGORY_COLORS = {
      'أكل ومشروبات': '#ef4444',
      'مواصلات': '#3b82f6',
      'تسوق': '#8b5cf6',
      'فواتير واشتراكات': '#f59e0b',
      'ترفيه': '#ec4899',
      'صحة': '#10b981',
      'تعليم': '#06b6d4',
      'سكن وأيجار': '#f97316',
      'ملابس': '#a855f7',
      'هدايا': '#d946ef',
      'أولاد': '#84cc16',
      'حيوانات أليفة': '#14b8a6',
      'أخرى': '#6b7280'
    };

    function doLogin() {
      const phone = document.getElementById('loginPhone').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      if (!phone) return;
      localStorage.setItem('ft_user', phone);
      if (password) localStorage.setItem('ft_pass', password);
      currentUser = phone;
      document.getElementById('loginError').classList.add('hidden');
      loadData();
    }

    function doLogout() {
      localStorage.removeItem('ft_user');
      localStorage.removeItem('ft_pass');
      currentUser = null;
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
    }

    async function loadData() {
      const phone = currentUser || localStorage.getItem('ft_user');
      const password = localStorage.getItem('ft_pass');
      if (!phone) return doLogin();

      currentUser = phone;
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('welcomeText').textContent = 'المستخدم: ' + phone;

      try {
        const summaryRes = await fetch('/api/summary?phone=' + encodeURIComponent(phone) + (password ? '&password=' + encodeURIComponent(password) : ''));
        if (!summaryRes.ok) throw new Error('no data');
        const s = await summaryRes.json();
        document.getElementById('budget').textContent = s.monthlyBudget + ' ج';
        document.getElementById('expenses').textContent = s.totalExpenses + ' ج';
        document.getElementById('income').textContent = s.totalIncome + ' ج';
        document.getElementById('remaining').textContent = s.remainingBudget + ' ج';

        renderPieChart(s.byCategory, s.totalExpenses);
        renderCategories(s.byCategory, s.totalExpenses);
        renderAvgComparison(s.byCategory);
      } catch (e) {
        document.getElementById('loginError').classList.remove('hidden');
        return;
      }

      try {
        const txRes = await fetch('/api/transactions?phone=' + encodeURIComponent(phone));
        const txs = await txRes.json();
        const txDiv = document.getElementById('transactions');
        if (txs.length === 0) {
          txDiv.innerHTML = '<div class="text-gray-500 text-sm text-center py-4">لا توجد عمليات مسجلة</div>';
        } else {
          txDiv.innerHTML = txs.map(t => {
            const isIncome = t.type === 'income';
            const emoji = isIncome ? '📥' : '📤';
            const color = isIncome ? 'text-blue-400' : 'text-red-400';
            return `<div class="flex items-center justify-between bg-gray-900/60 rounded-lg px-4 py-3">
              <div class="flex items-center gap-3">
                <span class="text-xl">${emoji}</span>
                <div>
                  <div class="font-medium">${t.description || t.category}</div>
                  <div class="text-xs text-gray-500">${t.category} - ${t.date.substring(0, 10)}</div>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <span class="${color} font-bold">${isIncome ? '+' : '-'}${t.amount} ج</span>
                <button onclick="deleteTx(${t.id})" class="text-red-400 hover:text-red-300 text-lg" title="حذف">✕</button>
              </div>
            </div>`;
          }).join('');
        }
      } catch (e) {}

      try {
        const compRes = await fetch('/api/comparison?phone=' + encodeURIComponent(phone));
        const compData = await compRes.json();
        renderBarChart(compData);
      } catch(e) {}
    }

    function renderPieChart(categories, total) {
      const canvas = document.getElementById('pieChart');
      const legend = document.getElementById('pieLegend');
      if (!categories || categories.length === 0) {
        canvas.style.display = 'none';
        legend.innerHTML = '<div class="text-gray-500 text-sm text-center">لا توجد مصروفات</div>';
        return;
      }
      canvas.style.display = 'block';
      const labels = categories.map(c => c.category);
      const data = categories.map(c => c.total);
      const colors = categories.map(c => CATEGORY_COLORS[c.category] || '#6b7280');

      if (pieChartInstance) pieChartInstance.destroy();
      pieChartInstance = new Chart(canvas, {
        type: 'doughnut',
        data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '55%',
          plugins: { legend: { display: false } }
        }
      });

      legend.innerHTML = categories.map(c => {
        const pct = total > 0 ? Math.round(c.total / total * 100) : 0;
        const color = CATEGORY_COLORS[c.category] || '#6b7280';
        return `<div class="flex items-center gap-2 text-sm">
          <span class="w-3 h-3 rounded-full inline-block" style="background:${color}"></span>
          <span class="flex-1">${c.category}</span>
          <span class="text-gray-400">${pct}%</span>
          <span class="font-bold">${c.total} ج</span>
        </div>`;
      }).join('');
    }

    function renderCategories(categories, total) {
      const catDiv = document.getElementById('categories');
      if (!categories || categories.length === 0) {
        catDiv.innerHTML = '<div class="text-gray-500 text-sm text-center py-4">لا توجد مصروفات بعد</div>';
        return;
      }
      catDiv.innerHTML = categories.map(c => {
        const pct = total > 0 ? Math.round(c.total / total * 100) : 0;
        const color = CATEGORY_COLORS[c.category] || '#6b7280';
        return `<div class="flex items-center gap-4 bg-gray-900/60 rounded-lg px-4 py-3">
          <span class="w-3 h-3 rounded-full flex-shrink-0" style="background:${color}"></span>
          <div class="flex-1">
            <div class="font-medium">${c.category}</div>
            <div class="w-full bg-gray-700 rounded-full h-1.5 mt-1">
              <div class="h-1.5 rounded-full" style="width:${pct}%; background:${color}"></div>
            </div>
          </div>
          <span class="text-sm font-bold">${c.total} ج</span>
          <span class="text-xs text-gray-400">${pct}%</span>
        </div>`;
      }).join('');
    }

    function renderAvgComparison(categories) {
      const div = document.getElementById('avgComparison');
      if (!categories || categories.length === 0) {
        div.innerHTML = '<div class="text-gray-500 text-sm text-center">لا توجد بيانات كافية</div>';
        return;
      }

      div.innerHTML = categories.map(c => {
        const avg = EGYPTIAN_AVERAGES[c.category] || 0;
        if (avg === 0) return '';
        const ratio = c.total / avg;
        const pct = Math.round(ratio * 100);
        let status, statusColor, barColor;
        if (ratio <= 0.8) {
          status = 'ممتاز!'; statusColor = 'text-green-400'; barColor = '#10b981';
        } else if (ratio <= 1.1) {
          status = 'طبيعي'; statusColor = 'text-yellow-400'; barColor = '#f59e0b';
        } else {
          status = 'أكتر من المتوسط'; statusColor = 'text-red-400'; barColor = '#ef4444';
        }
        const barWidth = Math.min(pct, 100);
        return `<div class="bg-gray-900/60 rounded-lg px-4 py-3">
          <div class="flex items-center justify-between mb-1">
            <span class="font-medium">${c.category}</span>
            <span class="${statusColor} text-sm font-bold">${status} (${pct}%)</span>
          </div>
          <div class="flex items-center gap-3">
            <div class="flex-1 bg-gray-700 rounded-full h-2">
              <div class="h-2 rounded-full" style="width:${barWidth}%; background:${barColor}"></div>
            </div>
            <span class="text-xs text-gray-400">أنت: ${c.total} ج | المتوسط: ${avg} ج</span>
          </div>
        </div>`;
      }).filter(Boolean).join('');
    }

    function renderBarChart(data) {
      const canvas = document.getElementById('barChart');
      if (!data || data.length === 0) {
        canvas.style.display = 'none';
        return;
      }
      canvas.style.display = 'block';
      const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
      const labels = data.map(d => monthNames[d.month - 1]);
      const expenses = data.map(d => d.totalExpenses);
      const income = data.map(d => d.totalIncome);

      if (barChartInstance) barChartInstance.destroy();
      barChartInstance = new Chart(canvas, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'المصروفات', data: expenses, backgroundColor: '#ef4444', borderRadius: 6 },
            { label: 'الدخل', data: income, backgroundColor: '#3b82f6', borderRadius: 6 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#9ca3af', font: { size: 11 } } } },
          scales: {
            x: { ticks: { color: '#9ca3af' }, grid: { display: false } },
            y: { ticks: { color: '#9ca3af' }, grid: { color: '#374151' } }
          }
        }
      });
    }

    if (localStorage.getItem('ft_user')) {
      loadData();
    }

    async function deleteTx(id) {
      const phone = currentUser || localStorage.getItem('ft_user');
      const password = localStorage.getItem('ft_pass');
      if (!phone) return;
      if (!confirm('متأكد تحذف العملية دي؟')) return;
      try {
        const res = await fetch('/api/transactions/' + id + '?phone=' + encodeURIComponent(phone) + (password ? '&password=' + encodeURIComponent(password) : ''), { method: 'DELETE' });
        if (res.status === 403) { alert('巴斯ورد غلط!'); return; }
        loadData();
      } catch(e) { alert('فيه مشكلة حصلت'); }
    }
  </script>
</body>
</html>
